[project]
name = "ferrolab-fse"
version = "0.1.0"
description = "Ferrolab Scientific Engine: motor determinista y trazable"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ferrolab_fse"]
